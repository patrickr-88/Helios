name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One job, two platforms. The engine makes no platform assumptions, so Linux
  # is the fast gate and macOS is the shipping target.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      # Smoke-test the real binary against a real filesystem: several classes of
      # bug only appear outside a fixture.
      - run: cargo build --release
      - run: ./target/release/helios
      - run: ./target/release/helios . --top 5 --quiet
      - run: ./target/release/helios . --tree --depth 3 --quiet
      - run: ./target/release/helios . -o /tmp/report.pdf --quiet

  # Windows is Phase 6 and platform/windows.rs has never been compiled against
  # the real SDK. This job exists to tell us what is left; it is non-blocking
  # until that work lands, at which point remove continue-on-error.
  test-windows:
    name: Test (windows, not yet required)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
